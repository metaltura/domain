name: Domain
instanceOf: Core:Model
elements:
  - name: Entity
    instanceOf: Core:Class
    icon: mui:ViewInAr
    color: '#1565c0'
    extends:
      - Core:RootElement
      - Core:Type
    properties:
      - name: extends
        instanceOf: Core:Relation
        to: Domain:Entity
        supertype: true
      - name: fields
        instanceOf: Core:Relation
        multiple: true
        to: Domain:Field
        composite: true
        opposite: Domain:Field.entity
      - name: relations
        instanceOf: Core:Relation
        multiple: true
        to: Domain:EntityRelation
        composite: true
        opposite: Domain:EntityRelation.entity
      - name: invariants
        instanceOf: Core:Relation
        multiple: true
        to: Domain:Invariant
        composite: true
        opposite: Domain:Invariant.entity
      - name: lifecycle
        instanceOf: Core:Relation
        to: Domain:Lifecycle
        composite: true
        opposite: Domain:Lifecycle.entity
  - name: Field
    instanceOf: Core:Class
    icon: mui:ShortText
    extends:
      - Core:Feature
    properties:
      - name: entity
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Entity
        opposite: Domain:Entity.fields
      - name: type
        instanceOf: Core:Relation
        mandatory: true
        to: Core:Primitive
  - name: EntityRelation
    instanceOf: Core:Class
    icon: mui:Shortcut
    extends:
      - Core:Feature
    properties:
      - name: entity
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Entity
        opposite: Domain:Entity.relations
      - name: type
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Entity
      - name: composite
        instanceOf: Core:PrimitiveProperty
        type: Core:Boolean
      - name: opposite
        instanceOf: Core:Relation
        to: Domain:EntityRelation
  - name: Invariant
    instanceOf: Core:Class
    icon: mui:Rule
    extends:
      - Core:Element
    properties:
      - name: entity
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Entity
        opposite: Domain:Entity.invariants
      - name: message
        instanceOf: Core:PrimitiveProperty
        type: Core:String
      - name: check
        instanceOf: Core:FunctionProperty
        mandatory: true
        input:
          - name: entity
            instanceOf: Core:InputFeature
            mandatory: true
            type: Core:Element
        output:
          name: result
          instanceOf: Core:OutputFeature
          type: Core:Boolean
        perInstance: true
  - name: Lifecycle
    instanceOf: Core:Class
    icon: mui:Loop
    extends:
      - Core:Element
    properties:
      - name: entity
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Entity
        opposite: Domain:Entity.lifecycle
      - name: states
        instanceOf: Core:Relation
        multiple: true
        to: Domain:State
        composite: true
        opposite: Domain:State.lifecycle
      - name: transitions
        instanceOf: Core:Relation
        multiple: true
        to: Domain:Transition
        composite: true
        opposite: Domain:Transition.lifecycle
      - name: initialState
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:State
        filter: |
          export default function run(state: any, owner: any): boolean {
            return !!state && state.lifecycle === owner
          }
  - name: State
    instanceOf: Core:Class
    icon: mui:RadioButtonChecked
    extends:
      - Core:Element
    properties:
      - name: lifecycle
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Lifecycle
        opposite: Domain:Lifecycle.states
  - name: Transition
    instanceOf: Core:Class
    icon: mui:TrendingFlat
    extends:
      - Core:Element
    properties:
      - name: lifecycle
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Lifecycle
        opposite: Domain:Lifecycle.transitions
      - name: source
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:State
        filter: |
          export default function run(state: any, owner: any): boolean {
            return !!state && !!owner && state.lifecycle === owner.lifecycle
          }
      - name: target
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:State
        filter: |
          export default function run(state: any, owner: any): boolean {
            return !!state && !!owner && state.lifecycle === owner.lifecycle
          }
      - name: guard
        instanceOf: Core:FunctionProperty
        input:
          - name: entity
            instanceOf: Core:InputFeature
            mandatory: true
            type: Core:Element
        output:
          name: result
          instanceOf: Core:OutputFeature
          type: Core:Boolean
        perInstance: true
  - name: Service
    instanceOf: Core:Class
    icon: mui:Build
    color: '#2e7d32'
    extends:
      - Core:RootElement
    properties:
      - name: operations
        instanceOf: Core:Relation
        multiple: true
        to: Domain:Operation
        composite: true
        opposite: Domain:Operation.service
      - name: dependencies
        instanceOf: Core:Relation
        multiple: true
        to: Domain:Service
  - name: Operation
    instanceOf: Core:Class
    icon: mui:Code
    extends:
      - Core:Function
    properties:
      - name: service
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Service
        opposite: Domain:Service.operations
  - name: Process
    instanceOf: Core:Class
    icon: mui:AccountTree
    color: '#6a1b9a'
    extends:
      - Core:RootElement
    properties:
      - name: steps
        instanceOf: Core:Relation
        multiple: true
        to: Domain:Step
        composite: true
        opposite: Domain:Step.process
      - name: startStep
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Step
        filter: |
          export default function run(step: any, owner: any): boolean {
            return !!step && step.process === owner
          }
  - name: Step
    instanceOf: Core:Class
    icon: mui:PlayArrow
    extends:
      - Core:Element
    properties:
      - name: process
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Process
        opposite: Domain:Process.steps
      - name: service
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Service
      - name: operation
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Operation
        filter: |
          export default function run(operation: any, owner: any): boolean {
            if (!operation || !owner) return false
            if (!owner.service) return true
            return operation.service === owner.service
          }
      - name: branches
        instanceOf: Core:Relation
        multiple: true
        to: Domain:Branch
        composite: true
        opposite: Domain:Branch.step
  - name: Branch
    instanceOf: Core:Class
    icon: mui:CallSplit
    extends:
      - Core:Element
    properties:
      - name: step
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Step
        opposite: Domain:Step.branches
      - name: target
        instanceOf: Core:Relation
        mandatory: true
        to: Domain:Step
        filter: |
          export default function run(step: any, owner: any): boolean {
            return !!step && !!owner && !!owner.step && step.process === owner.step.process
          }
      - name: condition
        instanceOf: Core:FunctionProperty
        output:
          name: result
          instanceOf: Core:OutputFeature
          type: Core:Boolean
        perInstance: true
  - name: DomainClassDiagram
    instanceOf: Diagram:core.Diagram
